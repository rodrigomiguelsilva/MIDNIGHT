<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preçário de Peças</title>
<style>
:root{--bg:#0a0a0d;--card:#121116;--ink:#e9e4dc;--mut:#8d8794;--line:#27232d;--acc:#ff5a2a;--acc2:#ff8a4d;--deep:#0d0c10;--row:#18161d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a2035 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:24px 16px 8px}
h1{margin:0;font-size:2rem;letter-spacing:3px;color:var(--ink)}
.logo{display:block;margin:0 auto 6px;width:min(380px,85%);height:auto}
h1 span{color:var(--acc)}
header p{margin:6px 0 0;color:var(--mut);font-size:.85rem}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:var(--deep);color:var(--ink);border-bottom:2px solid var(--acc);text-align:left;padding:9px 8px;font-size:.8rem}
th:nth-child(n+2){background:var(--deep);color:var(--acc2);text-align:right}
td{padding:6px 8px;border-top:1px solid var(--line);font-size:.9rem}
tr:nth-child(even) td{background:var(--row)}
td.p,td.s{text-align:right;white-space:nowrap}
td.s{font-weight:700;min-width:80px}
td.q{width:96px;text-align:center;white-space:nowrap}
.q button{width:24px;height:26px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font-size:1rem;line-height:1}
.q input{width:38px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;background:var(--card);color:var(--ink);font-size:.9rem;-moz-appearance:textfield}
.q input::-webkit-outer-spin-button,.q input::-webkit-inner-spin-button{-webkit-appearance:none}
tr.on td{background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.hide{display:none}
.sum{position:sticky;bottom:0;margin-top:16px;background:var(--deep);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.disc{display:flex;gap:6px;align-items:center}
.disc input,.disc select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;width:90px}
.disc select{width:auto}
.total{font-size:1.6rem;font-weight:800;color:var(--acc2)}
.clear{background:#b3261e;color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:700;cursor:pointer;font-size:.95rem}
.small{opacity:.8;font-size:.85rem}
</style>
</head>

</header>
<div class="wrap">
  <input class="search" id="search" type="search" placeholder="Pesquisar peça…">
  <div class="cols">
    <table><thead><tr><th>Peça</th><th>Preço</th><th>Qtd.</th><th>Subtotal</th></tr></thead><tbody id="t1"></tbody></table>
    <table><thead><tr><th>Peça</th><th>Preço</th><th>Qtd.</th><th>Subtotal</th></tr></thead><tbody id="t2"></tbody></table>
  </div>

  <div class="sum">
    <div class="line"><span>Subtotal (<span id="items">0</span> peças)</span><strong id="sub">0 €</strong></div>
    <div class="line">
      <span>Desconto</span>
      <div class="disc">
        <input id="dv" type="number" min="0" step="any" value="0" inputmode="decimal">
        <select id="dt"><option value="pct">%</option><option value="eur">€</option></select>
      </div>
      <strong id="dd">− 0 €</strong>
    </div>
    <div class="line"><span class="total" id="tot">0 €</span><button class="clear" id="clear">🗑 Limpar conta</button></div>
  </div>
</div>

<script>
const L=[["Bomba de água",1465],["Radiador de óleo",2050],["Radiador",1755],["Termostato",925],["Ventoinhas",620],["Turbo",11815],["Sistema de nitro",4535],["Intercooler",6120],["Válvula wastegate",2440],["Válvula de descarga (blow-off)",1790],["Garrafa de nitro",7500],["Garrafa de nitro (recarga)",5000],["Garrafa de nitro vazia",2500],["Bomba de combustível",8825],["Injetores",11330],["Rampa de ignição",1310],["Regulador de pressão",1790],["Escape de meio",2255],["Escape final",1885],["Comando suspensão a ar",2000],["Bobinas",2145],["Cablagem",1295],["Velas",600],["Bomba de óleo",1310],["Filtro de óleo",850],["Óleo do motor",390]];
const R=[["Admissão",760],["Cabeça de motor",4400],["Cambota",5420],["Coletor de admissão",1465],["Coletor de escape",3000],["Corpo de borboletas",1980],["Filtro de ar",1145],["Junta de cabeça",965],["Molas de válvula",1390],["Pistões",3935],["Válvula",1310],["Árvore de cames",4625],["Bielas",3000],["Pneus de arranque de drag",1450],["Pneus drift",2300],["Pneus slick",760],["Suspensão a ar",3000],["Caixa de velocidades competição",13010],["Caixa de velocidades sequencial",7930],["Diferencial autobloqueante duas vias",3435],["Embraiagem",1220],["Travões de cerâmica",3350],["Pastilhas de travão",660],["Cartão de memória",40000],["Película de matrícula",80000],["Pen fuel tech",1000],["Pen com mapa",1000000],["Fuel Tech (oficinas)",100000],["Fuel Tech (pessoas)",300000],["Kit de nitro (oficinas)",50000],["Kit de nitro (público)",150000]];
const fmt=n=>n.toLocaleString("pt-PT",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";
const rows=[];
function build(list,tb){
  list.forEach(([name,price])=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${name}</td><td class="p">${fmt(price)}</td><td class="q"><button type="button">−</button><input type="number" min="0" step="1" value="0" inputmode="numeric"><button type="button">+</button></td><td class="s">—</td>`;
    const [m,p]=tr.querySelectorAll("button"),inp=tr.querySelector("input");
    const set=v=>{inp.value=Math.max(0,Math.floor(+v||0));calc()};
    m.onclick=()=>set(+inp.value-1);p.onclick=()=>set(+inp.value+1);
    inp.oninput=()=>calc();inp.onfocus=()=>inp.select();
    tb.appendChild(tr);
    rows.push({tr,inp,price,name:name.toLowerCase(),s:tr.querySelector(".s")});
  });
}
build(L,document.getElementById("t1"));build(R,document.getElementById("t2"));
const $=id=>document.getElementById(id);
function calc(){
  let sub=0,n=0;
  rows.forEach(r=>{
    const q=Math.max(0,Math.floor(+r.inp.value||0)),v=q*r.price;
    sub+=v;n+=q;r.s.textContent=q?fmt(v):"—";r.tr.classList.toggle("on",q>0);
  });
  let d=Math.max(0,+$("dv").value||0);
  d=$("dt").value==="pct"?sub*Math.min(d,100)/100:Math.min(d,sub);
  $("items").textContent=n;$("sub").textContent=fmt(sub);
  $("dd").textContent="− "+fmt(d);$("tot").textContent=fmt(sub-d);
}
$("dv").oninput=calc;$("dt").onchange=calc;
$("clear").onclick=()=>{rows.forEach(r=>r.inp.value=0);$("dv").value=0;$("dt").value="pct";$("search").value="";filter();calc()};
function filter(){const s=$("search").value.trim().toLowerCase();rows.forEach(r=>r.tr.classList.toggle("hide",!!s&&!r.name.includes(s)))}
$("search").oninput=filter;
calc();
</script>
